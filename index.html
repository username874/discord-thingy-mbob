
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Discord Chat</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #18181f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 32px;
            text-align: center;
            background: #252530;
            border-radius: 16px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            color: #a5b4fc;
        }

        p {
            color: #c4c4d0;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 20px;
            background: #343445;
            color: #a5b4fc;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Private Discord Chat</h1>
        <p>A private place to chat with your Discord community.</p>
        <div class="status">Website created successfully!</div>
    </main>
</body>
</html>
